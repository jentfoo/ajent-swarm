name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-tidy:
    name: Verify Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # the module replace points at ../ajent, so the sibling must exist
      - uses: actions/checkout@v7
        with:
          repository: jentfoo/ajent
          path: ../ajent

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.15.0/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.15.0

      - name: Run lint check
        run: |
          make lint
          # Fail if lint auto-formatting changed any files
          git diff --exit-code

      - name: Run tidy check
        run: |
          go mod tidy
          # Fail if go.mod or go.sum changed
          git diff --exit-code go.mod go.sum

  test:
    name: Verify Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go:
        - '1.26'
        - '1.27'
    steps:
      - uses: actions/checkout@v7

      # the module replace points at ../ajent, so the sibling must exist
      - uses: actions/checkout@v7
        with:
          repository: jentfoo/ajent
          path: ../ajent

      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}

      - name: Run unit tests
        run: make test

  load:
    name: Verify Load Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: jentfoo/ajent
          path: ../ajent

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # fanout and SQLite-under-scheduler-load verifications (phase 12)
      - name: Run load checks
        run: go test -count=1 -run 'TestFanout|TestSQLiteStaysHealthy' ./pkg/api ./pkg/sched

  web:
    name: Verify Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Lint, typecheck and test
        run: make web-check

  e2e:
    name: Verify E2E Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # the smoke run builds ajent itself, so the sibling checkout is the
      # source of truth for both the module replace and the binary
      - uses: actions/checkout@v7
        with:
          repository: jentfoo/ajent
          path: ../ajent

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install playwright browsers
        run: cd web && pnpm install --frozen-lockfile && pnpm exec playwright install chromium

      - name: Run the smoke suite
        run: make test-e2e

  audit:
    name: Verify Dependency Audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: jentfoo/ajent
          path: ../ajent

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Audit both trees
        run: make audit

